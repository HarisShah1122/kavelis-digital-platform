[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Email backend (Nodemailer). Functions declare their own /api/* paths, which
# take precedence over the SPA fallback below. The signature PNGs ship with
# the functions so they can be attached inline.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/email/*.png"]

# SPA fallback so deep links resolve to the client router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
